<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <title>CFW Studio — Retro Handheld SD Flasher & Formatter</title>
    <meta name="description" content="Rootless microSD OS flasher for retro handhelds (Knulli, Spruce, nxRedux) and FAT32, exFAT, and NTFS formatter over USB OTG." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/branding/cfw-studio-icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/branding/cfw-studio-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/branding/cfw-studio-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/branding/cfw-studio-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="CFW Studio — Retro Handheld SD Flasher & Formatter" />
    <meta property="og:description" content="Rootless microSD OS flasher for retro handhelds (Knulli, Spruce, nxRedux) and FAT32, exFAT, and NTFS formatter over USB OTG." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/branding/cfw-studio-thumbnail.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/branding/cfw-studio-thumbnail.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cfw_studio_theme');
          var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
